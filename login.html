<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ORTOBOM - Login</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#eef3f9;margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;color:#203448}
main{background:white;border-radius:18px;padding:30px;width:100%;max-width:420px;box-shadow:0 6px 24px #152e4915}
h1{color:#145b99;margin-top:0}
label{display:block;margin:16px 0 6px;font-weight:bold}
input,button{width:100%;padding:14px;border-radius:9px;font-size:16px}
input{border:1px solid #aebdcb}
button{background:#145b99;color:white;border:0;margin-top:24px;font-weight:bold}
button:disabled{opacity:.6}
#msg{line-height:1.5}
</style>
</head>
<body>
<main>
<h1>ORTOBOM</h1>
<h2>Acesso ao sistema</h2>
<form id="form">
<label for="email">E-mail</label>
<input id="email" type="email" autocomplete="username" required>
<label for="senha">Senha</label>
<input id="senha" type="password" autocomplete="current-password" required>
<button id="entrar" type="submit">Entrar</button>
</form>
<p id="msg" role="status"></p>
</main>
<script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const URL_SUPABASE='https://ryuipntsmhybxvxjauqw.supabase.co';
const CHAVE_PUBLICA='COLE_AQUI_SUA_CHAVE_PUBLICAVEL';
const msg=document.getElementById('msg');
const form=document.getElementById('form');
const botao=document.getElementById('entrar');
if(CHAVE_PUBLICA.startsWith('COLE_AQUI')){
msg.textContent='Configure a chave publicável do Supabase antes de entrar.';
form.querySelectorAll('input,button').forEach(el=>el.disabled=true);
}else{
const supabase=createClient(URL_SUPABASE,CHAVE_PUBLICA);
form.addEventListener('submit',async(e)=>{
e.preventDefault();
botao.disabled=true;
msg.textContent='Verificando acesso...';
try{
const {data,error}=await supabase.auth.signInWithPassword({
email:document.getElementById('email').value.trim(),
password:document.getElementById('senha').value
});
if(error)throw error;
const {data:perfil,error:erroPerfil}=await supabase
.from('usuarios').select('nome,perfil,unidade_id,ativo')
.eq('id',data.user.id).single();
if(erroPerfil||!perfil||!perfil.ativo){
await supabase.auth.signOut();
throw new Error('Perfil não autorizado. Procure o administrador.');
}
msg.textContent='Bem-vindo, '+perfil.nome+'! Perfil: '+perfil.perfil+'.';
}catch(err){
msg.textContent=err.message==='Invalid login credentials'
?'E-mail ou senha incorretos.':err.message;
}finally{botao.disabled=false;}
});
}
</script>
</body>
</html>
