<!doctype html><html lang='pt-BR'><meta charset='utf-8'><title>Backup do login ORTOBOM</title><body><h1>Backup do login anterior</h1><p>Versão anterior preservada em código-fonte abaixo. Não usar como login de produção.</p><pre id='codigo'></pre><script>document.getElementById('codigo').textContent="<!doctype html><html lang=\"pt-BR\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>PROGRAMAÇÃO ORTOBOM</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#eaf1f9;font-family:Arial,sans-serif;color:#203047;padding:20px}main{background:white;padding:28px;border-radius:18px;max-width:420px;width:100%;box-shadow:0 8px 30px #12345618}h1{text-align:center;color:#145b99}h2{text-align:center;font-size:17px;font-weight:normal}label{display:block;font-weight:bold;margin:18px 0 7px}input,select,button{width:100%;padding:14px;border-radius:9px;font-size:16px}input,select{border:1px solid #b7c7d8}button{border:0;background:#145b99;color:white;margin-top:22px;font-weight:bold}button:disabled{opacity:.6}[hidden]{display:none!important}#msg{line-height:1.5}.dados{background:#f0f5fa;padding:15px;border-radius:10px}</style></head><body><main><h1>ORTOBOM</h1><h2>PROGRAMAÇÃO ORTOBOM</h2><form id=\"form\"><label for=\"unidade\">Unidade</label><select id=\"unidade\" required><option value=\"\">Selecione a unidade</option><option value=\"todas\">Todas as unidades (administrador)</option><option value=\"2\">Unidade 2</option><option value=\"4\">Unidade 4</option><option value=\"5\">Unidade 5</option><option value=\"6\">Unidade 6</option><option value=\"7\">Unidade 7</option><option value=\"8\">Unidade 8</option><option value=\"9\">Unidade 9</option><option value=\"10\">Unidade 10</option><option value=\"11\">Unidade 11</option><option value=\"15\">Unidade 15</option><option value=\"18\">Unidade 18</option><option value=\"26\">Unidade 26</option><option value=\"27\">Unidade 27</option></select><label for=\"nome\">Funcionário</label><select id=\"nome\" required disabled><option value=\"\">Selecione a unidade primeiro</option></select><label for=\"senha\">Senha do funcionário ORTOBOM</label><input id=\"senha\" type=\"password\" autocomplete=\"current-password\" required minlength=\"6\" maxlength=\"6\" inputmode=\"numeric\" pattern=\"[0-9]{6}\" placeholder=\"Digite sua senha\"><button id=\"entrar\" type=\"submit\">Entrar</button><button type=\"button\" id=\"ajudaSenha\" style=\"background:#eef4fa;color:#145b99;margin-top:10px\">Esqueci a senha do aplicativo</button><div id=\"ajudaTexto\" hidden style=\"margin-top:12px;padding:12px;background:#f0f5fa;border-radius:9px;font-size:14px;line-height:1.5\">Esta senha é exclusiva do funcionário ORTOBOM e não é a senha do painel Supabase. Para redefinir a senha do administrador Rogerio, abra <a href=\"https://supabase.com/dashboard/project/ryuipntsmhybxvxjauqw/auth/users\" target=\"_blank\" rel=\"noopener\">Supabase → Authentication → Users</a>, selecione Rogerio e use <strong>Send password recovery</strong>. Abra o link recebido por e-mail e defina uma nova senha de seis números para o aplicativo. Para outros funcionários, solicite a redefinição ao gestor.</div></form><section id=\"painel\" hidden><div class=\"dados\"><p><strong>Nome:</strong> <span id=\"p_nome\"></span></p><p><strong>Perfil:</strong> <span id=\"perfil\"></span></p><p><strong>Unidade:</strong> <span id=\"p_unidade\"></span></p></div><p>Autenticação realizada com sucesso.</p><button id=\"sair\">Sair</button></section><p id=\"msg\" role=\"status\" aria-live=\"polite\"></p></main><script type=\"module\">\nimport {createClient} from 'https://esm.sh/@supabase/supabase-js@2';\nconst supabase=createClient('https://ryuipntsmhybxvxjauqw.supabase.co','sb_publishable_7i6Dv1GT7JVxwaBZ85oI9A_9hOof1VV');\nconst el=id=>document.getElementById(id),form=el('form'),painel=el('painel'),msg=el('msg');\nel('ajudaSenha').addEventListener('click',()=>{el('ajudaTexto').hidden=!el('ajudaTexto').hidden});\nasync function mostrar(user){const {data,error}=await supabase.from('usuarios').select('nome,perfil,unidade_id,ativo').eq('id',user.id).single();if(error||!data?.ativo){await supabase.auth.signOut();msg.textContent='Acesso não autorizado.';return}el('p_nome').textContent=data.nome;el('perfil').textContent=data.perfil;el('p_unidade').textContent=data.unidade_id??'Todas as unidades';form.hidden=true;painel.hidden=false;msg.textContent='Bem-vindo ao sistema!'}\nel('unidade').addEventListener('change',async()=>{const lista=el('nome'),unidade=el('unidade').value;lista.replaceChildren(new Option('Carregando...',''));lista.disabled=true;if(!unidade)return;try{const res=await fetch('https://ryuipntsmhybxvxjauqw.supabase.co/functions/v1/login-funcionario',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({acao:'listar',unidade})});const data=await res.json();if(!res.ok)throw Error(data.erro);if(unidade!==el('unidade').value)return;lista.replaceChildren(new Option('Selecione o funcionário',''));for(const nome of data.funcionarios||[])lista.add(new Option(nome,nome));lista.disabled=!(data.funcionarios||[]).length;msg.textContent=lista.disabled?'Nenhum funcionário cadastrado nesta unidade.':''}catch(e){msg.textContent='Não foi possível carregar a lista.'}});\nform.addEventListener('submit',async e=>{e.preventDefault();el('entrar').disabled=true;msg.textContent='Verificando acesso...';try{const response=await fetch('https://ryuipntsmhybxvxjauqw.supabase.co/functions/v1/login-funcionario',{method:'POST',headers:{'Content-Type':'application/json','apikey':'sb_publishable_7i6Dv1GT7JVxwaBZ85oI9A_9hOof1VV'},body:JSON.stringify({unidade:el('unidade').value,nome:el('nome').value.trim(),senha:el('senha').value})});const data=await response.json();if(!response.ok)throw Error(data.erro||'Não foi possível entrar');el('p_nome').textContent=data.nome;el('perfil').textContent=data.perfil;el('p_unidade').textContent=data.unidade;form.hidden=true;painel.hidden=false;msg.textContent='Senha ORTOBOM validada.'}catch(err){msg.textContent=err.message||'Falha ao conectar'}finally{el('entrar').disabled=false}});\nel('sair').addEventListener('click',async()=>{await supabase.auth.signOut();painel.hidden=true;form.hidden=false;el('senha').value='';msg.textContent='Você saiu do sistema.'});\n\n</script></body></html>"</script></body></html>
