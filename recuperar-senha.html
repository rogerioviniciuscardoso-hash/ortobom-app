<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ORTOBOM - Nova senha</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#eaf1f9;font-family:Arial,sans-serif;color:#203047}main{width:100%;max-width:420px;background:white;border-radius:18px;padding:28px;box-shadow:0 8px 30px #12345618}h1{color:#145b99;text-align:center}label{display:block;margin:18px 0 7px;font-weight:bold}input,button{width:100%;padding:14px;border-radius:9px;font-size:16px}input{border:1px solid #b7c7d8}button{border:0;background:#145b99;color:white;font-weight:bold;margin-top:22px}button:disabled{opacity:.6}#msg{line-height:1.5}</style></head><body><main><h1>ORTOBOM</h1><h2>Definir nova senha</h2><p id="msg">Validando link de recuperação...</p><form id="form" hidden><label for="senha">Nova senha</label><input id="senha" type="password" autocomplete="new-password" minlength="6" required><label for="confirmar">Confirmar nova senha</label><input id="confirmar" type="password" autocomplete="new-password" minlength="6" required><button id="salvar">Salvar nova senha</button></form></main><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2';const supabase=createClient('https://ryuipntsmhybxvxjauqw.supabase.co','sb_publishable_7i6Dv1GT7JVxwaBZ85oI9A_9hOof1VV',{auth:{detectSessionInUrl:true}});const form=document.getElementById('form'),msg=document.getElementById('msg');let valid=false;const show=()=>{valid=true;form.hidden=false;msg.textContent='Escolha uma nova senha para sua conta.'};supabase.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY')show()});try{const params=new URLSearchParams(location.hash.slice(1));const search=new URLSearchParams(location.search);if(params.get('type')==='recovery'&&params.get('access_token')&&params.get('refresh_token')){const{error}=await supabase.auth.setSession({access_token:params.get('access_token'),refresh_token:params.get('refresh_token')});if(error)throw error;show()}else if(search.get('code')){const{error}=await supabase.auth.exchangeCodeForSession(search.get('code'));if(error)throw error;show()}else{await new Promise(r=>setTimeout(r,1200));if(!valid)msg.textContent='Link de recuperação inválido ou expirado. Solicite outro e-mail pelo Supabase.'}}catch(e){msg.textContent='Não foi possível validar o link. Solicite um novo e-mail.'}form.addEventListener('submit',async e=>{e.preventDefault();if(!valid)return;const senha=document.getElementById('senha').value;if(senha!==document.getElementById('confirmar').value){msg.textContent='As senhas não coincidem.';return}document.getElementById('salvar').disabled=true;const{error}=await supabase.auth.updateUser({password:senha});if(error){msg.textContent='Não foi possível atualizar: '+error.message;document.getElementById('salvar').disabled=false;return}msg.textContent='Senha atualizada. Você já pode entrar no sistema.';form.hidden=true;await supabase.auth.signOut();const a=document.createElement('a');a.href='./login.html';a.textContent='Abrir login ORTOBOM';msg.append(' ',a)});</script></body></html>
