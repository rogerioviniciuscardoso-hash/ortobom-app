
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PROGRAMAÇÃO ORTOBOM - Login</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: #eaf1f9;
      font-family: Arial, sans-serif;
      color: #203047;
    }
    main {
      width: 100%;
      max-width: 420px;
      background: white;
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 8px 30px #12345618;
    }
    h1 { color: #145b99; text-align: center; margin: 0; }
    h2 { text-align: center; font-size: 17px; font-weight: normal; }
    label { display: block; margin: 18px 0 7px; font-weight: bold; }
    input, button {
      width: 100%;
      padding: 14px;
      border-radius: 9px;
      font-size: 16px;
    }
    input { border: 1px solid #b7c7d8; }
    button {
      margin-top: 22px;
      border: 0;
      background: #145b99;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: wait; }
    #msg { line-height: 1.5; overflow-wrap: anywhere; }
    .dados { background: #f0f5fa; padding: 15px; border-radius: 10px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
<main>
  <h1>ORTOBOM</h1>
  <h2>PROGRAMAÇÃO ORTOBOM</h2>

  <form id="form">
    <label for="email">E-mail</label>
    <input id="email" type="email" autocomplete="username" required>

    <label for="senha">Senha</label>
    <input id="senha" type="password" autocomplete="current-password" required>

    <button id="entrar" type="submit">Entrar</button>
  </form>

  <section id="painel" hidden>
    <div class="dados">
      <p><strong>Nome:</strong> <span id="nome"></span></p>
      <p><strong>Perfil:</strong> <span id="perfil"></span></p>
      <p><strong>Unidade:</strong> <span id="unidade"></span></p>
    </div>
    <p>Autenticação realizada com sucesso.</p>
    <button id="sair" type="button">Sair</button>
  </section>

  <p id="msg" role="status" aria-live="polite"></p>
</main>

<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

  const URL_SUPABASE = 'https://ryuipntsmhybxvxjauqw.supabase.co';
  const CHAVE_PUBLICA = 'sb_publishable_7i6Dv1GT7JVxwaBZ85oI9A_9hOof1VV';

  const form = document.getElementById('form');
  const painel = document.getElementById('painel');
  const msg = document.getElementById('msg');
  const entrar = document.getElementById('entrar');
  const sair = document.getElementById('sair');

  if (CHAVE_PUBLICA.startsWith('COLE_AQUI')) {
    msg.textContent = 'Configure a chave publicável do Supabase no código.';
    entrar.disabled = true;
  } else {
    const supabase = createClient(URL_SUPABASE, CHAVE_PUBLICA);

    async function mostrarPerfil(usuario) {
      const { data, error } = await supabase
        .from('usuarios')
        .select('nome, perfil, unidade_id, ativo')
        .eq('id', usuario.id)
        .single();

      if (error || !data || !data.ativo) {
        await supabase.auth.signOut();
        form.hidden = false;
        painel.hidden = true;
        msg.textContent = 'Acesso não autorizado ou perfil não encontrado.';
        return;
      }

      document.getElementById('nome').textContent = data.nome;
      document.getElementById('perfil').textContent = data.perfil;
      document.getElementById('unidade').textContent =
        data.unidade_id ?? 'Todas as unidades (administrador)';

      form.hidden = true;
      painel.hidden = false;
      msg.textContent = 'Bem-vindo ao sistema!';
    }

    form.addEventListener('submit', async (evento) => {
      evento.preventDefault();
      entrar.disabled = true;
      msg.textContent = 'Verificando acesso...';

      try {
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('senha').value;

        const { data, error } = await supabase.auth.signInWithPassword({
          email,
          password
        });

        if (error) {
          msg.textContent = 'E-mail ou senha inválidos.';
          return;
        }

        await mostrarPerfil(data.user);
      } catch (erro) {
        msg.textContent = 'Não foi possível conectar. Tente novamente.';
      } finally {
        entrar.disabled = false;
      }
    });

    sair.addEventListener('click', async () => {
      await supabase.auth.signOut();
      painel.hidden = true;
      form.hidden = false;
      document.getElementById('senha').value = '';
      msg.textContent = 'Você saiu do sistema.';
    });

    async function verificarSessao() {
      const { data: { session } } = await supabase.auth.getSession();
      if (session?.user) {
        await mostrarPerfil(session.user);
      }
    }

    verificarSessao();
  }
</script>
</body>
</html>
