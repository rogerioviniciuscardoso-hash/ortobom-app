<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PROMOTOR ORTOBOM</title><style>body{font-family:system-ui;background:#f3f6fb;margin:0;color:#183153}main{max-width:440px;margin:8vh auto;padding:20px}section{background:white;border-radius:18px;padding:26px;box-shadow:0 5px 24px #1232}h1{color:#173b78}label{display:block;margin:18px 0;font-weight:600}input,select,button{width:100%;padding:14px;border-radius:9px;border:1px solid #bbc7d5;box-sizing:border-box;margin-top:6px;font-size:16px}button{background:#173b78;color:white;font-weight:700;border:0}small{display:block;margin-top:15px;color:#596c80}#msg{color:#b12222}</style><main><section><h1>PROMOTOR ORTOBOM</h1><p>Acesso por unidade e usuário</p><label>Unidade<select id="unit"><option value="">Selecione a unidade</option><option value="2">Unidade 2</option><option value="4">Unidade 4</option><option value="5">Unidade 5</option><option value="6">Unidade 6</option><option value="7">Unidade 7</option><option value="8">Unidade 8</option><option value="9">Unidade 9</option><option value="10">Unidade 10</option><option value="11">Unidade 11</option><option value="15">Unidade 15</option><option value="18">Unidade 18</option><option value="26">Unidade 26</option><option value="27">Unidade 27</option></select></label><label>Usuário<input id="user" autocomplete="username" placeholder="Nome do usuário"></label><label>Senha de 6 dígitos<input id="pin" type="password" inputmode="numeric" maxlength="6" autocomplete="current-password" placeholder="000000"></label><button id="login">Entrar</button><button id="first" style="margin-top:12px;background:#607b9c">Primeiro acesso / cadastrar senha</button><p id="msg" role="alert"></p><small>Prévia de acesso. O login só será liberado após a configuração segura de usuários e senhas.</small></section></main><script>document.getElementById('login').onclick=()=>document.getElementById('msg').textContent='A autenticação ainda está em configuração. Nenhuma senha foi enviada.';document.getElementById('first').onclick=()=>document.getElementById('msg').textContent='O cadastro da senha será habilitado após a ativação do serviço de autenticação.';</script></html>
