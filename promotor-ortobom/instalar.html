<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123c7b"><meta name="mobile-web-app-capable" content="yes"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><title>Instalar PROMOTOR ORTOBOM</title><style>body{font-family:Arial,sans-serif;background:#edf2fa;margin:0;min-height:100vh;display:grid;place-items:center;color:#163766}.card{max-width:420px;margin:20px;background:white;border-radius:20px;padding:28px;text-align:center;box-shadow:0 8px 30px #123c7b20}img{width:116px;height:116px}h1{font-size:23px}button,a.action{display:block;width:100%;box-sizing:border-box;padding:17px;margin:16px 0;border:0;border-radius:12px;background:#123c7b;color:#fff;font-weight:bold;font-size:18px;text-decoration:none;cursor:pointer}.secondary{background:#e9eef8!important;color:#123c7b!important}p{line-height:1.5}small{color:#65748b}</style></head><body><div class="card"><img src="./icon.svg" alt="Ícone ORTOBOM"><h1>PROMOTOR ORTOBOM</h1><p>Instale o aplicativo no celular com o ícone ORTOBOM.</p><button id="install">INSTALAR APLICATIVO</button><p id="status" aria-live="polite">Toque no botão para instalar.</p><a class="action secondary" href="./entrada-v61.html">ABRIR APLICATIVO</a><small>Versão 61</small></div><script>let pending=null;const status=document.getElementById('status'),btn=document.getElementById('install');window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();pending=e;status.textContent='Pronto para instalar. Toque em INSTALAR APLICATIVO.'});window.addEventListener('appinstalled',()=>{pending=null;status.textContent='Aplicativo instalado com sucesso!';btn.textContent='INSTALADO';btn.disabled=true});btn.addEventListener('click',async()=>{if(pending){const e=pending;pending=null;await e.prompt();const result=await e.userChoice;status.textContent=result.outcome==='accepted'?'Instalação aceita. Aguarde o ícone aparecer.':'Instalação cancelada.';return}if(window.matchMedia('(display-mode: standalone)').matches){status.textContent='O aplicativo já está instalado.';return}status.textContent='Este navegador não liberou a instalação direta. Abra este mesmo link no Google Chrome para Android e toque novamente em INSTALAR APLICATIVO.'});if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{status.textContent='Não foi possível ativar o instalador neste navegador.'});</script></body></html>
