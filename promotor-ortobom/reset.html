<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atualizar PROMOTOR ORTOBOM</title><style>body{font-family:Arial,sans-serif;background:#eef3fa;color:#173c75;padding:32px}button{padding:18px;background:#18467f;color:white;border:0;border-radius:10px;font-size:18px}</style><h2>Atualização do PROMOTOR ORTOBOM</h2><p id="status">Preparando atualização...</p><button id="go">Abrir aplicativo atualizado</button><script>async function reset(){document.getElementById('status').textContent='Limpando versões antigas...';try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.filter(r=>r.scope.includes('/ortobom-app/promotor-ortobom/')).map(r=>r.unregister()))}if('caches'in window){const keys=await caches.keys();await Promise.all(keys.filter(k=>k.startsWith('promotor-ortobom-')).map(k=>caches.delete(k)))}}catch(e){}document.getElementById('status').textContent='Atualização concluída. Abrindo aplicativo...';location.replace('./index.html?versao=52&atualizado=1')}document.getElementById('go').onclick=reset;reset();</script></html>
