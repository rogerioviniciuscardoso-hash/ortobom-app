<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ORTOBOM - Recuperar senha</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#eaf1f9;font:16px Arial,sans-serif;color:#203047;padding:20px}main{width:100%;max-width:420px;padding:28px;background:#fff;border-radius:18px;box-shadow:0 8px 30px #12345618}h1{color:#145b99;text-align:center}label{display:block;font-weight:bold;margin:20px 0 8px}input,button{width:100%;padding:14px;border-radius:9px;font-size:16px}input{border:1px solid #b7c8d8}button{margin-top:20px;background:#145b99;color:white;border:0;font-weight:bold}button:disabled{opacity:.6}#msg{line-height:1.5}</style></head><body><main><h1>ORTOBOM</h1><section id="reset" hidden><h2>Definir nova senha</h2><form id="form"><label for="senha">Nova senha</label><input id="senha" type="password" minlength="6" required autocomplete="new-password"><label for="confirmar">Confirme a nova senha</label><input id="confirmar" type="password" minlength="6" required autocomplete="new-password"><button id="salvar">Salvar nova senha</button></form></section><p id="msg">Verificando link de recuperação...</p><p id="voltar" hidden><a href="./login.html">Voltar ao login</a></p></main><script type="module">
import{createClient}from'https://esm.sh/@supabase/supabase-js@2';
const supabase=createClient("https://ryuipntsmhybxvxjauqw.supabase.co","sb_publishable_7i6Dv1GT7JVxwaBZ85oI9A_9hOof1VV",{auth:{detectSessionInUrl:true,persistSession:true}});
const el=id=>document.getElementById(id),params=new URLSearchParams(location.hash.slice(1)),query=new URLSearchParams(location.search);
const recovery=params.get('type')==='recovery'||query.get('type')==='recovery'||!!query.get('code')||!!params.get('access_token')||!!query.get('token_hash');
if(!recovery){location.replace('./login.html');}else{
 try{
  if(query.get('token_hash')){const {error}=await supabase.auth.verifyOtp({token_hash:query.get('token_hash'),type:'recovery'});if(error)throw error}
  if(query.get('code')){const {error}=await supabase.auth.exchangeCodeForSession(query.get('code'));if(error)throw error}
  const {data:{session}}=await supabase.auth.getSession();
  if(!session)throw Error('O link expirou ou não é válido. Solicite outro e-mail de recuperação.');
  el('reset').hidden=false;el('msg').textContent='Digite e confirme sua nova senha.';
 }catch(err){el('msg').textContent=err.message||'Não foi possível validar o link.';el('voltar').hidden=false}
 el('form').addEventListener('submit',async e=>{e.preventDefault();const senha=el('senha').value;if(senha!==el('confirmar').value){el('msg').textContent='As senhas não coincidem.';return}el('salvar').disabled=true;el('msg').textContent='Salvando...';const {error}=await supabase.auth.updateUser({password:senha});if(error){el('msg').textContent=error.message;el('salvar').disabled=false;return}await supabase.auth.signOut();el('reset').hidden=true;el('msg').textContent='Senha atualizada. Volte ao login ORTOBOM.';el('voltar').hidden=false;history.replaceState(null,'',location.pathname)});
}
</script></body></html>
